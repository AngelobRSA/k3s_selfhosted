# Hypervisor-aware topology labels.
#
# Nothing in Kubernetes knows which *physical* Proxmox host a VM sits on.
# Longhorn's anti-affinity and Traefik's spread constraints both key on
# `kubernetes.io/hostname`, which is satisfied by 3 distinct VMs even when all
# three share one hypervisor. That has already caused real exposure twice.
#
# These stubs stamp `topology.kubernetes.io/zone: <proxmox-host>` onto every
# node. Longhorn reads the label off the k8s Node and mirrors it onto the
# `nodes.longhorn.io` CR, so this one label drives both consumers.
#
# Zone == physical Proxmox host. Live mapping (with IPs) lives in the
# gitignored `docs/runbooks/physical-topology.md`; regenerate with topomap.py.
#
# ⚠️ Every Node carries `prune: disabled`. Without it, deleting an entry from
# this file would make Flux delete the *actual Node object* from the cluster.
# `ssa: merge` keeps Flux from fighting the kubelet over fields it doesn't own.
---
apiVersion: v1
kind: Node
metadata:
  name: kmaster01
  labels:
    topology.kubernetes.io/zone: node01m910
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/ssa: merge
spec:
  # 🔴 Masters run storage and control plane ONLY — no application workloads.
  #
  # Declared on ALL FIVE masters, not just the two that had drifted. kmaster01
  # /04/05 were joined with this taint and kmaster02/03 were not, and the drift
  # was invisible: an untainted master looks identical to a tainted one until
  # the scheduler quietly puts Traefik on it. On 2026-08-25 kmaster02 was
  # running traefik, homepage, goldilocks-dashboard and cert-manager-webhook.
  #
  # k3s does not taint servers by default — it only happens if the node was
  # joined with --node-taint, which is why this kept "changing": it was never
  # declared anywhere, so each rebuild was a coin flip. Stating it here makes a
  # re-joined node unable to silently come back schedulable.
  #
  # This does NOT empty the masters, by design. Longhorn (csi-attacher,
  # csi-provisioner, instance-manager, share-manager) and the k3s system
  # components (coredns, metrics-server, local-path-provisioner) carry explicit
  # tolerations and stay. That is the intent: storage and control plane.
  taints:
    - key: node-role.kubernetes.io/control-plane
      value: "true"
      effect: NoSchedule
---
apiVersion: v1
kind: Node
metadata:
  name: kworker01
  labels:
    topology.kubernetes.io/zone: node01m910
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/ssa: merge
---
