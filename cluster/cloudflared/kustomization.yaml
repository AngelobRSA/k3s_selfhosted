apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets/tunnel-credentials.sops.yaml
  - deployment.yaml

# Hash-suffixed so a config edit rolls the pods.
configMapGenerator:
  - name: cloudflared-config
    namespace: cloudflared
    files:
      - config.yaml=files/config.yaml
