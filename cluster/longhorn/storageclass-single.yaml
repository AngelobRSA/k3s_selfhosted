apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single
  # ⚠️ NAME IS NOW A LIE — kept only because storageClassName is immutable on a
  # bound PVC, so renaming would mean recreating homeassistant-config,
  # paperless-data, karakeep-data, qdrant-storage, copyparty-data and ollama.
  # Read it as "the class for volumes where 3 replicas is overkill", not
  # "single replica".
provisioner: driver.longhorn.io
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  # Was "1" until 2026-08-22. Every one of the six volumes on this class had
  # already been hand-bumped to 2 replicas live on 2026-08-09, but the class
  # itself still said 1 — so ANY recreation of those PVCs would silently come
  # back single-replica, and Longhorn reports a 1-replica volume as `healthy`
  # forever. That is exactly how immich-library and both vaultwarden volumes
  # were lost. None of these six are disposable.
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  dataLocality: "best-effort"
  disableRevisionCounter: "true"
  fsType: "ext4"
