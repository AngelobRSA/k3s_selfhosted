apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  releaseName: longhorn
  chart:
    spec:
      chart: longhorn
      version: 1.10.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  interval: 30m
  values:
    defaultSettings:
      # 2 -> 3 on 2026-08-22. The 2-replica policy was a correct response to a
      # THREE-zone cluster: with hard zone anti-affinity, a 3-replica volume
      # consumed every zone, so taking one host down for maintenance left
      # nowhere to rebuild and volumes sat degraded until it came back.
      # node05m920 became the 4th nvme zone on 2026-08-09 and nobody revisited
      # this. With 4 zones, 3 replicas leaves exactly one spare to rebuild into.
      # Capacity was never the constraint (~18% of 2.3 TiB at 3 replicas).
      defaultReplicaCount: "3"
      defaultDataLocality: best-effort
      # Node-level: two replicas may never share a k8s node.
      replicaSoftAntiAffinity: false
      # Hypervisor-level: two replicas may never share a Proxmox host either.
      # Zones come from `topology.kubernetes.io/zone` (see cluster/topology/),
      # which Longhorn mirrors onto the nodes.longhorn.io CR automatically.
      #
      # Safe to make this hard: the nvme-tagged disks live in 4 distinct zones —
      # node01m910, node02m910, node03m920, node05m920 — so a 3-replica volume
      # leaves ONE spare zone to rebuild into, and a 2-replica volume leaves two.
      # ⚠️ 4 zones is now the hard ceiling on replica count. Do not raise any
      # StorageClass above 3 without adding a fifth nvme zone first.
      # (kmaster04's entry was removed 2026-08-09: its USB enclosure moved to
      # node05, leaving a stale disk pointed at the OS root.)
      # Consequence to know before maintenance: with 3 of those 4 hosts down, a
      # rebuild will refuse to schedule rather than double up. Degraded and
      # honest, instead of quietly co-located.
      replicaZoneSoftAntiAffinity: false
      allowVolumeCreationWithDegradedAvailability: false
      disableRevisionCounter: "true"
      defaultLonghornStaticDataCompliance: false
      # ⚠️ RENAMED IN LONGHORN 1.9 — was `orphanAutoDeletion: true` here until
      # 2026-08-10. That key stopped existing, the chart silently dropped it
      # (same class as [[reference_helm_silent_unknown_values]]), and the live
      # setting `orphan-resource-auto-deletion` sat at "" — meaning NOTHING was
      # ever reaped. By 2026-08-10 that had accumulated 49 orphaned replica
      # dirs / ~142 GB, including 105 GB on kmaster02 alone (which had zero
      # live replicas). The phantom usage also skewed Longhorn's scheduler,
      # which scores disks by free space — kmaster02 looked as full as
      # kmaster01, so rebuilds kept landing elsewhere.
      #
      # Value is a semicolon-separated list, NOT a bool. Verified against the
      # admission webhook with `kubectl patch --dry-run=server`: a bogus value
      # is rejected, so this one is confirmed valid rather than assumed.
      orphanResourceAutoDeletion: "replica-data;instance"
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      
    longhornManager:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    longhornDriver:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    persistence:
      defaultClass: false
      reclaimPolicy: Delete
      defaultFsType: ext4
      # Explicit, not inherited. This is what actually sets numberOfReplicas on
      # the `longhorn` StorageClass — NOT defaultReplicaCount above, which only
      # applies to volumes created without an SC parameter. It happened to be 3
      # already because 3 is the chart default; stating it makes the choice
      # reviewable. ⚠️ The `longhorn` SC is rendered by longhorn-manager from
      # the `longhorn-storageclass` ConfigMap, so it carries no Helm ownership
      # annotations and cannot be managed by a plain manifest in this repo.
      defaultClassReplicaCount: 3

    # Longhorn exported nothing to Prometheus until 2026-08-09 — there was no
    # ServiceMonitor in longhorn-system at all, so `longhorn_volume_robustness`
    # had zero series. That is why "nothing alerts on degraded volumes": the
    # metric did not exist to alert on, and 7 volumes went faulted during the
    # node02 outage with no signal.
    #
    # The `release` label is required: the Prometheus CR selects ServiceMonitors
    # with `serviceMonitorSelector: matchLabels: {release: kube-prometheus-stack}`.
    # Without it the ServiceMonitor is created and silently ignored.
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack



