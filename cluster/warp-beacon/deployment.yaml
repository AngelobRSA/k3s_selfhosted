apiVersion: apps/v1
kind: Deployment
metadata:
  name: warp-beacon
  namespace: warp-beacon
spec:
  # If the beacon is down, phones fall back to the default WARP profile.
  # Everything still works, but via the tunnel (100 MB upload cap).
  # Two replicas keep that rare.
  replicas: 2
  selector:
    matchLabels:
      app: warp-beacon
  template:
    metadata:
      labels:
        app: warp-beacon
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: warp-beacon
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine
          ports:
            - name: tls
              containerPort: 8443
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tls
              mountPath: /etc/beacon
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: tls
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: conf
          configMap:
            name: warp-beacon-nginx
        - name: tls
          secret:
            secretName: warp-beacon-tls
