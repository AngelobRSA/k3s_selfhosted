# TLS beacon for Cloudflare WARP "managed network" detection. When a phone
# can complete a TLS handshake here and the cert's SHA-256 matches, WARP knows
# it's on the home LAN and switches to the "home-lan" device profile.
# That profile sends bijouxlabs.cc DNS to VyOS, so traffic stays local.
# Only the handshake matters; the body is irrelevant.
server {
    listen 8443 ssl;
    ssl_certificate     /etc/beacon/tls.crt;
    ssl_certificate_key /etc/beacon/tls.key;
    access_log off;
    location / { return 204; }
}
