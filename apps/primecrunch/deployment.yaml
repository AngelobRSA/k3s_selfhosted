apiVersion: apps/v1
kind: Deployment
metadata:
  name: primecrunch
  namespace: primecrunch
spec:
  replicas: 0
  selector:
    matchLabels:
      app: primecrunch
  template:
    metadata:
      labels:
        app: primecrunch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: crunch
          image: ghcr.io/angelobrsa/primecrunch-docker:3.3.12
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - "-u=false"
            - "-p"
            - "2"
          env:
            - name: CRUNCH_EMAIL
              valueFrom:
                secretKeyRef:
                  name: primecrunch-credentials
                  key: email
            - name: CRUNCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: primecrunch-credentials
                  key: password
            - name: CRUNCH_CHANNEL
              value: stable
            - name: CRUNCH_DIR
              value: /data
            - name: NAME_PREFIX
              value: k8s
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Sized from Goldilocks/VPA, 18d of samples (2026-08-09).
          # 🔴 The cpu limit of "1" was throttling this container on 78.6% of
          # its CFS periods — VPA measured a 1168m target against a 1000m cap.
          # CPU is compressible: dropping the limit costs nothing and lets it
          # burst into idle cycles. The request is what guarantees its floor.
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
