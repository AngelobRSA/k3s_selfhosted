apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      nodeSelector:
        kubernetes.io/hostname: kworker01
      containers:
        - name: homeassistant
          image: homeassistant/home-assistant:2026.8.3
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8123
          env:
            - name: TZ
              value: Africa/Johannesburg
          volumeMounts:
            - mountPath: /config
              name: config
          # Sized from Goldilocks/VPA, 18d of samples (2026-08-09).
          # 🔴 Was the tightest workload in the cluster: VPA's upper bound of
          # 990Mi sat at 97% of the old 1Gi limit, one busy automation run from
          # an OOMKill. Request raised to the measured target (933Mi), limit
          # given real headroom. A restart here is expensive — HA needs
          # use_x_forwarded_for + trusted_proxies re-applied after a restore.
          resources:
            requests:
              cpu: 25m
              memory: 1Gi
            limits:
              memory: 1536Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
