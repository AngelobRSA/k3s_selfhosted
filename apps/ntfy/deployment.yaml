apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      # Keep the notifier off node04g4800 while it is down, and prefer a
      # node that is not carrying the Prometheus it reports on.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.26.3
          args: ["serve"]
          ports:
            - name: http
              containerPort: 80
          env:
            - name: TZ
              value: Africa/Johannesburg
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy/server.yml
              subPath: server.yml
            # ntfy loads named templates from --template-dir, default
            # /etc/ntfy/templates. subPath keeps server.yml above intact.
            - name: config
              mountPath: /etc/ntfy/templates/bijouxlabs.yml
              subPath: bijouxlabs.yml
            - name: data
              mountPath: /var/lib/ntfy
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Sized from Goldilocks/VPA, 18d of samples (2026-08-09).
          # Request was 32Mi against a measured 100Mi — and ntfy carries every
          # cluster alert, so under-requesting it means the alerting path is
          # what gets evicted first under node memory pressure.
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
