base-url: "https://ntfy.bijouxlabs.cc"
listen-http: ":80"

# Alertmanager's webhook payload carries every alert in a group, and ntfy's
# built-in `alertmanager` template renders all of them into one message. A
# 7-alert group blew the 4K default on 2026-08-03 and ntfy returned 400
# (code 40041). Alertmanager treats 4xx as unrecoverable, so those alerts were
# dropped outright rather than retried. Headroom here is the backstop; the
# grouping in the Alertmanager route is what keeps messages small in practice.
# Note: >4K messages are not deliverable over Firebase/APNs, which only matters
# for iOS via the ntfy.sh proxy. LAN/Tailscale Android clients are unaffected.
message-size-limit: "16K"

cache-file: "/var/lib/ntfy/cache.db"
cache-duration: "72h"
attachment-cache-dir: "/var/lib/ntfy/attachments"

# Behind Traefik, which sets X-Forwarded-For. Required for correct
# client IPs and rate limiting.
behind-proxy: true

# LAN + Tailscale only; this host is not published via cloudflared.
# Hardening follow-up: set auth-default-access "deny-all" and provision
# a token for Alertmanager (needs a manual `ntfy user add`, so it is not
# done here to keep the deploy fully declarative).
auth-file: "/var/lib/ntfy/auth.db"
auth-default-access: "read-write"

# Keep the web UI usable but quiet.
enable-signup: false
enable-login: true
