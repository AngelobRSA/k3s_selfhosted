apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 12h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "67.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 30m
  values:
    # k3s embeds these components and does not expose their metrics endpoints
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    prometheus:
      prometheusSpec:
        scrapeInterval: 30s
        retention: 14d
        retentionSize: 45GB
        additionalScrapeConfigs:
          - job_name: proxmox-node-exporter
            static_configs:
              - targets: ["192.168.0.110:9100"]
                labels:
                  nodename: proxmox
              - targets: ["192.168.0.211:9100"]
                labels:
                  nodename: node01m910
              - targets: ["192.168.0.212:9100"]
                labels:
                  nodename: node02m910
              - targets: ["192.168.0.213:9100"]
                labels:
                  nodename: node03m920
              - targets: ["192.168.0.214:9100"]
                labels:
                  nodename: node04g4800
          - job_name: proxmox-smartctl
            static_configs:
              - targets: ["192.168.0.110:9633"]
                labels:
                  nodename: proxmox
              - targets: ["192.168.0.211:9633"]
                labels:
                  nodename: node01m910
              - targets: ["192.168.0.212:9633"]
                labels:
                  nodename: node02m910
              - targets: ["192.168.0.213:9633"]
                labels:
                  nodename: node03m920
              - targets: ["192.168.0.214:9633"]
                labels:
                  nodename: node04g4800
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-single
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        resources:
          requests:
            cpu: 200m
            memory: 2Gi
          limits:
            memory: 4Gi

    alertmanager:
      config:
        global:
          resolve_timeout: 5m

        receivers:
          # Discard sink. Only Watchdog should ever land here.
          - name: "null"

          # ntfy renders Alertmanager's payload with its own built-in
          # template (requires ntfy >= v2.14.0; we run v2.26.3). No bridge
          # or translator container is needed.
          - name: ntfy
            webhook_configs:
              - url: "http://ntfy.ntfy.svc.cluster.local/bijouxlabs?template=alertmanager"
                send_resolved: true

          - name: ntfy-critical
            webhook_configs:
              - url: "http://ntfy.ntfy.svc.cluster.local/bijouxlabs-critical?template=alertmanager&priority=urgent"
                send_resolved: true

        route:
          # Group by alertname+severity so one failed host produces one
          # notification rather than one per affected component.
          group_by: ["alertname", "severity"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: ntfy
          routes:
            # Watchdog fires constantly by design — it is the dead-man's
            # switch, not an alert. Never notify on it.
            - matchers:
                - alertname = "Watchdog"
              receiver: "null"

            - matchers:
                - alertname = "ProxmoxHostDown"
                - severity = "critical"
              receiver: ntfy-critical
              repeat_interval: 4h

            - matchers:
                - alertname = "SmartCriticalWarning"
                - severity = "critical"
              receiver: ntfy-critical
              repeat_interval: 4h

            - matchers:
                - alertname = "HostRootDiskSpaceCritical"
                - severity = "critical"
              receiver: ntfy-critical
              repeat_interval: 4h

            - matchers:
                - alertname = "HostTemperatureCritical"
                - severity = "critical"
              receiver: ntfy-critical
              repeat_interval: 4h

            # Warnings

            - matchers:
                - alertname = "DesktopCPUTemperatureWarning"
                - severity = "warning"
              receiver: ntfy
              repeat_interval: 12h

            - matchers:
                - alertname = "HostCPUTemperatureWarning"
                - severity = "warning"
              receiver: ntfy
              repeat_interval: 12h

            - matchers:
                - alertname = "HostRootDiskSpaceLow"
                - severity = "warning"
              receiver: ntfy
              repeat_interval: 24h

            - matchers:
                - alertname = "SmartWearoutHigh"
                - severity = "warning"
              receiver: ntfy
              repeat_interval: 48h

            # Safety net. The routes above enumerate specific alertnames, which
            # means any NEW critical rule silently inherits the quiet default
            # until someone remembers to add a route. This catches them.
            # Today it covers MemoryUncorrectableErrors and
            # SmartSpareBelowThreshold, neither of which is listed above.
            # Must stay last — matching stops at the first hit.
            - matchers:
                - severity = "critical"
              receiver: ntfy-critical
              repeat_interval: 4h

        inhibit_rules:
          # A dead host implies its disks and sensors are unreachable. Suppress
          # the downstream noise so one failure sends one notification.
          - source_matchers: ["alertname = ProxmoxHostDown"]
            target_matchers: ["component =~ disk|thermal|memory"]
            equal: ["nodename"]
          - source_matchers: ["severity = critical"]
            target_matchers: ["severity = warning"]
            equal: ["alertname", "nodename"]

    grafana:
      fullnameOverride: grafana
      grafana.ini:
        server:
          root_url: https://grafana.bijouxlabs.cc
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
        hosts:
          - grafana.bijouxlabs.cc
        tls:
          - hosts:
              - grafana.bijouxlabs.cc
      sidecar:
        dashboards:
          enabled: true
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
