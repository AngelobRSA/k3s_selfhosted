apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 12h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "67.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 30m
  # The default 5m is not enough: an upgrade rolls the Prometheus StatefulSet,
  # and a restart here replays a 45GB WAL before the pod reports ready. The
  # 2026-08-03 upgrade hit "context deadline exceeded" mid-rollout — Helm had
  # already applied the manifests, it just gave up waiting, which left the
  # release marked failed while the new config was in fact live.
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # k3s embeds these components and does not expose their metrics endpoints
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    # Rewrite `instance` from the scrape address to the actual node name, so
    # alerts and dashboards say "kmaster01" instead of "192.168.0.154:9100".
    #
    # ⚠️ This MUST live under the `prometheus-node-exporter` SUBCHART key.
    # The top-level `nodeExporter:` key exists but only carries `enabled` and
    # `operatingSystems` — putting relabelings there is silently accepted and
    # silently dropped. See reference_helm_silent_unknown_values.
    prometheus-node-exporter:
      prometheus:
        monitor:
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: instance

    prometheus:
      prometheusSpec:
        scrapeInterval: 30s
        retention: 14d
        retentionSize: 45GB
        additionalScrapeConfigs:
          - job_name: proxmox-node-exporter
            static_configs:
              - targets: ["192.168.0.110:9100"]
                labels:
                  nodename: proxmox
              - targets: ["192.168.0.211:9100"]
                labels:
                  nodename: node01m910
              - targets: ["192.168.0.212:9100"]
                labels:
                  nodename: node02m910
              - targets: ["192.168.0.213:9100"]
                labels:
                  nodename: node03m920
              - targets: ["192.168.0.214:9100"]
                labels:
                  nodename: node04g4800
              # 6th host, joined the cluster 2026-08-08. The hardware dashboard
              # discovers hosts via label_values(up{job="proxmox-node-exporter"})
              # so it picks this up with no dashboard change.
              - targets: ["192.168.0.72:9100"]
                labels:
                  nodename: node05m920
          - job_name: proxmox-smartctl
            static_configs:
              - targets: ["192.168.0.110:9633"]
                labels:
                  nodename: proxmox
              - targets: ["192.168.0.211:9633"]
                labels:
                  nodename: node01m910
              - targets: ["192.168.0.212:9633"]
                labels:
                  nodename: node02m910
              - targets: ["192.168.0.213:9633"]
                labels:
                  nodename: node03m920
              - targets: ["192.168.0.214:9633"]
                labels:
                  nodename: node04g4800
              - targets: ["192.168.0.72:9633"]
                labels:
                  nodename: node05m920
        storageSpec:
          volumeClaimTemplate:
            spec:
              # Was `longhorn-single`. On 2026-08-09 node02 hard-hung and took
              # Prometheus down with it, because this volume's only replica
              # lived there — so the monitoring stack died with the failure it
              # existed to report, and no alert could fire about any of it.
              #
              # ⚠️ storageClassName on an existing PVC is IMMUTABLE. Changing it
              # here only affects a freshly created PVC; the live volume was
              # bumped to 2 replicas out of band on the Longhorn side. If this
              # StatefulSet's PVC is ever recreated, verify the new volume
              # actually landed at 2 replicas rather than assuming it.
              storageClassName: longhorn-nvme
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        resources:
          requests:
            cpu: 200m
            memory: 2Gi
          limits:
            memory: 4Gi

    alertmanager:
      alertmanagerSpec:
        # HA 2026-08-10. Alertmanager clusters natively over gossip and
        # DEDUPLICATES notifications across replicas, so 2 pods do NOT mean 2
        # pings to the dead-man's switch or 2 ntfy messages.
        # This became load-bearing once the external dead-man's switch went
        # live: a single Alertmanager meant the thing that proves the cluster
        # is alive was itself a single point of failure.
        # Key verified against kube-prometheus-stack 67.11.0 values
        # (alertmanagerSpec.replicas).
        replicas: 2

        # Mounts Secret/alertmanager-deadman at
        # /etc/alertmanager/secrets/alertmanager-deadman/<key>.
        # Holds the external heartbeat URL, which is a credential: anyone with
        # it can keep the check green and suppress the very alert it exists to
        # raise. That is why it is a mounted secret + `url_file` rather than an
        # inline URL — this repo is public, and `alertmanager.config` is
        # rendered verbatim into a Secret AND visible on the HelmRelease object.
        secrets:
          - alertmanager-deadman

      config:
        global:
          resolve_timeout: 5m

        receivers:
          # Discard sink. Nothing should land here now that Watchdog is routed
          # to `deadman`; kept as an explicit target for future silencing.
          - name: "null"

          # 🔴 THE DEAD-MAN'S SWITCH.
          #
          # Watchdog fires permanently by design. Routing it to "null" (as we
          # did until 2026-08-10) makes it useless: a heartbeat nobody outside
          # the cluster observes cannot detect the cluster dying. ntfy AND
          # uptime-kuma are both in-cluster, so a full-cluster loss previously
          # paged NOBODY — exactly what happened on 2026-08-09.
          #
          # The logic is INVERTED vs every other receiver here: we are not
          # notifying on a problem, we are proving liveness. The external
          # service alerts when these pings STOP.
          #
          # send_resolved: false — Watchdog never resolves, and a "resolved"
          # POST would look identical to a heartbeat to the ping endpoint.
          - name: deadman
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-deadman/url
                send_resolved: false

          # ntfy renders Alertmanager's payload server-side (requires ntfy
          # >= v2.14.0; we run v2.26.3). No bridge or translator container.
          #
          # `bijouxlabs` is OUR named template, defined in
          # apps/ntfy/files/templates/bijouxlabs.yml and mounted into ntfy's
          # --template-dir. It replaces the built-in `alertmanager` template,
          # which rendered 9 lines per notification — including
          # "Instance: <no value>" and "Source: <no value>", since our
          # hardware rules carry neither label.
          #
          # Alertmanager webhook_configs cannot send custom headers, so the
          # template must be selected via query string.
          # `click` makes the notification tappable. It is NOT templated by
          # ntfy (only title/message are), so it cannot deep-link to each
          # alert's generatorURL — it points at our hardware dashboard.
          # Alertmanager itself has no ingress, so it is not an option.
          - name: ntfy
            webhook_configs:
              - url: "http://ntfy.ntfy.svc.cluster.local/bijouxlabs?template=bijouxlabs&click=https%3A%2F%2Fgrafana.bijouxlabs.cc%2Fd%2Fhardware-bijouxlabs"
                send_resolved: true

          - name: ntfy-critical
            webhook_configs:
              - url: "http://ntfy.ntfy.svc.cluster.local/bijouxlabs-critical?template=bijouxlabs&priority=urgent&click=https%3A%2F%2Fgrafana.bijouxlabs.cc%2Fd%2Fhardware-bijouxlabs"
                send_resolved: true

        route:
          # Grouping controls both notification count AND message size — one
          # knob. ["alertname","severity"] batched 7 alerts on 2026-08-03 and
          # blew ntfy's limit, dropping all of them.
          #
          # nodename is the primary key: one failing host produces one message,
          # and inhibit_rules below already collapse its downstream disk/thermal
          # /memory noise via equal: ["nodename"].
          #
          # alertname is required alongside it. Only our 13 hardware rules carry
          # nodename (it rides in from the scrape-config static_configs labels);
          # the ~127 bundled kube-prometheus-stack rules do not. Alertmanager
          # treats an absent label as a single shared group value, so grouping
          # on nodename alone would funnel EVERY Kubernetes alert into one
          # unbounded group — the exact batch that overflowed. alertname keeps
          # those split.
          group_by: ["nodename", "alertname"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: ntfy
          routes:
            # Watchdog fires constantly by design — it is the dead-man's
            # switch, not an alert. Never notify on it IN-CLUSTER; instead
            # ping an EXTERNAL heartbeat endpoint so its silence is the signal.
            #
            # This route MUST stay first: matching stops at the first hit, and
            # the `severity = critical` safety net at the bottom would otherwise
            # spam ntfy with a permanently-firing alert.
            #
            # TIMING — ping every 5m; the external check alerts after 30m of
            # silence (period 15m + grace 15m). Chosen 2026-08-10.
            #
            # How these combine: Alertmanager sends immediately (group_wait 0s),
            # then re-sends the still-firing Watchdog every repeat_interval,
            # never more often than group_interval. Effective ping rate is
            # max(group_interval, repeat_interval) = 5m.
            #
            # Why 5m and not 1m: a 15m check period gives 3x headroom over the
            # ping rate, so a single dropped ping or a brief Alertmanager
            # restart cannot trip a false alarm. At a 1m ping rate the tolerance
            # window is too tight and 03:00 false alarms teach you to ignore the
            # one alert that must never be ignored.
            #
            # Why not slower: the 2026-08-09 outage ran ~13h undetected. 30m
            # worst-case detection is a ~26x improvement while keeping the
            # signal trustworthy.
            #
            # ⚠️ If you change repeat_interval, change the check's period to
            # match (keep period >= 3x ping rate). Alertmanager also warns when
            # repeat_interval < group_interval — keep them equal.
            - matchers:
                - alertname = "Watchdog"
              receiver: deadman
              group_wait: 0s
              group_interval: 5m
              repeat_interval: 5m

            - matchers:
                - alertname = "ProxmoxHostDown"
                - severity = "critical"
              receiver: ntfy-critical
              repeat_interval: 4h

            - matchers:
                - alertname = "SmartCriticalWarning"
                - severity = "critical"
              receiver: ntfy-critical
              repeat_interval: 4h

            - matchers:
                - alertname = "HostRootDiskSpaceCritical"
                - severity = "critical"
              receiver: ntfy-critical
              repeat_interval: 4h

            - matchers:
                - alertname = "HostTemperatureCritical"
                - severity = "critical"
              receiver: ntfy-critical
              repeat_interval: 4h

            # Warnings

            - matchers:
                - alertname = "DesktopCPUTemperatureWarning"
                - severity = "warning"
              receiver: ntfy
              repeat_interval: 12h

            - matchers:
                - alertname = "HostCPUTemperatureWarning"
                - severity = "warning"
              receiver: ntfy
              repeat_interval: 12h

            - matchers:
                - alertname = "HostRootDiskSpaceLow"
                - severity = "warning"
              receiver: ntfy
              repeat_interval: 24h

            - matchers:
                - alertname = "SmartWearoutHigh"
                - severity = "warning"
              receiver: ntfy
              repeat_interval: 48h

            # Safety net. The routes above enumerate specific alertnames, which
            # means any NEW critical rule silently inherits the quiet default
            # until someone remembers to add a route. This catches them.
            # Today it covers MemoryUncorrectableErrors and
            # SmartSpareBelowThreshold, neither of which is listed above.
            # Must stay last — matching stops at the first hit.
            - matchers:
                - severity = "critical"
              receiver: ntfy-critical
              repeat_interval: 4h

        inhibit_rules:
          # A dead host implies its disks and sensors are unreachable. Suppress
          # the downstream noise so one failure sends one notification.
          - source_matchers: ["alertname = ProxmoxHostDown"]
            target_matchers: ["component =~ disk|thermal|memory"]
            equal: ["nodename"]
          - source_matchers: ["severity = critical"]
            target_matchers: ["severity = warning"]
            equal: ["alertname", "nodename"]

    grafana:
      fullnameOverride: grafana
      grafana.ini:
        server:
          root_url: https://grafana.bijouxlabs.cc
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
        hosts:
          - grafana.bijouxlabs.cc
        tls:
          - hosts:
              - grafana.bijouxlabs.cc
      sidecar:
        dashboards:
          enabled: true
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
