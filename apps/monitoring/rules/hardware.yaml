apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bijouxlabs-hardware
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # Physical Proxmox hosts. See docs/captains-log.md for the incidents
    # these rules were derived from.
    - name: bijouxlabs.host
      rules:
        - alert: ProxmoxHostDown
          expr: up{job="proxmox-node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
            component: host
          annotations:
            summary: "Proxmox host {{ $labels.nodename }} is unreachable"
            description: >-
              node-exporter on {{ $labels.nodename }} ({{ $labels.instance }})
              has been unreachable for 5m. This does not by itself mean the VMs
              are down — check HostManagementPlaneWedged before treating it as a
              dead box. Runbook: docs/runbooks/node04-triage.md

        - alert: HostUnexpectedReboot
          expr: changes(node_boot_time_seconds{job="proxmox-node-exporter"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
            component: host
          annotations:
            summary: "Host {{ $labels.nodename }} rebooted unexpectedly"
            description: >-
              {{ $labels.nodename }} booted within the last 15m. If this was not
              planned, treat it as a hardware warning.

        # Ready k8s nodes per Proxmox host, keyed on `nodename` to join against
        # the proxmox-node-exporter `up` series. Zone label is GitOps-managed in
        # cluster/topology/nodes.yaml.
        # ⚠️ The `max by (node, ...)` wrappers are NOT cosmetic. During a
        # kube-state-metrics rollout two pods are scraped at once, so every
        # series exists twice. Unaggregated, the left side double-counts and
        # the right side gives group_left two matches per node — which is a
        # hard "duplicate series for the match group" error, silently killing
        # this rule for the whole rollout window.
        - record: bijouxlabs:ready_k8s_nodes_per_proxmox_host
          expr: |
            count by (nodename) (
              max by (node) (
                kube_node_status_condition{condition="Ready", status="true"} == 1
              )
              * on (node) group_left(nodename)
              label_replace(
                max by (node, label_topology_kubernetes_io_zone) (kube_node_labels),
                "nodename", "$1", "label_topology_kubernetes_io_zone", "(.*)"
              )
            )

        # A host that stops answering while its VMs keep running is wedged, not
        # dead, and must not be power-cycled blind.
        - alert: HostManagementPlaneWedged
          # Host's own exporter is unreachable, yet every k8s VM it hosts is
          # still Ready. A genuinely dead box takes its VMs with it.
          expr: |
            up{job="proxmox-node-exporter"} == 0
              and on (nodename)
            bijouxlabs:ready_k8s_nodes_per_proxmox_host > 0
          for: 10m
          labels:
            severity: critical
            component: host
          annotations:
            summary: "{{ $labels.nodename }} is serving VMs but unreachable for admin"
            description: >-
              node-exporter on {{ $labels.nodename }} is down, but its VMs are
              still Ready. The box is alive and running workloads — do not
              power-cycle it. Get console access and capture dmesg before
              rebooting. Runbook: docs/runbooks/node04-triage.md

    # Disks. Drive failure and wearout only; capacity lives in the group below.
    - name: bijouxlabs.disk
      rules:
        - alert: SmartCriticalWarning
          expr: smartctl_device_critical_warning > 0
          for: 5m
          labels:
            severity: critical
            component: disk
          annotations:
            summary: "SMART critical warning on {{ $labels.nodename }} {{ $labels.device }}"
            description: >-
              NVMe critical warning bitfield is {{ $value }} on
              {{ $labels.nodename }}/{{ $labels.device }}. This is the drive
              reporting its own failure. Back up and replace.

        - alert: SmartMediaErrors
          expr: increase(smartctl_device_media_errors[6h]) > 0
          for: 0m
          labels:
            severity: warning
            component: disk
          annotations:
            summary: "New media errors on {{ $labels.nodename }} {{ $labels.device }}"
            description: >-
              {{ $value }} new unrecoverable data-integrity errors in 6h on
              {{ $labels.nodename }}/{{ $labels.device }}. Suspect the drive or,
              for USB-attached NVMe, the enclosure.

        - alert: SmartSpareBelowThreshold
          expr: smartctl_device_available_spare < smartctl_device_available_spare_threshold
          for: 15m
          labels:
            severity: critical
            component: disk
          annotations:
            summary: "NVMe spare blocks exhausted on {{ $labels.nodename }} {{ $labels.device }}"
            description: >-
              Available spare {{ $value }}% is below the drive's own threshold.
              The drive is out of remap capacity — replace it.

        # Targets "stuck hot" rather than "working hard": NVMe here legitimately
        # reaches 70C+ under load, so the warning needs a long window.
        - alert: DriveTemperatureWarning
          expr: smartctl_device_temperature{temperature_type="current"} >= 65
          for: 30m
          labels:
            severity: warning
            component: thermal
          annotations:
            summary: "Drive {{ $labels.nodename }}/{{ $labels.device }} at {{ $value }}°C for 30m"
            description: >-
              Sustained high drive temperature. Under load this can be normal;
              held for 30m it suggests airflow — check the fan and dust before
              it becomes a thermal hang.

        - alert: DriveTemperatureCritical
          expr: smartctl_device_temperature{temperature_type="current"} >= 75
          for: 10m
          labels:
            severity: critical
            component: thermal
          annotations:
            summary: "Drive {{ $labels.nodename }}/{{ $labels.device }} at {{ $value }}°C"
            description: >-
              Drive is close to throttling or shutdown. NVMe controllers
              self-throttle around 80°C and the host may hang before that.

        - alert: SmartWearoutHigh
          expr: smartctl_device_percentage_used > 90
          for: 1h
          labels:
            severity: warning
            component: disk
          annotations:
            summary: "NVMe wearout {{ $value }}% on {{ $labels.nodename }} {{ $labels.device }}"
            description: >-
              Drive has consumed {{ $value }}% of its rated write endurance.
              Plan a replacement; not urgent.

    # Capacity. Root filesystems only — /boot is statically 50-65% everywhere
    # and tmpfs/fuse mounts are not real storage.
    - name: bijouxlabs.capacity
      rules:
        - alert: HostRootDiskSpaceLow
          expr: |
            100 * (
              1 - node_filesystem_avail_bytes{mountpoint="/", fstype=~"ext4|xfs|btrfs"}
                / node_filesystem_size_bytes{mountpoint="/", fstype=~"ext4|xfs|btrfs"}
            ) >= 75
          for: 15m
          labels:
            severity: warning
            component: disk
          annotations:
            summary: "Root filesystem {{ $value | printf \"%.0f\" }}% full on {{ $labels.nodename }}{{ $labels.instance }}"
            description: >-
              The OS disk is at or above 75% capacity. The k3s VMs run 32Gi
              root disks with little headroom, and a full root disk takes
              kubelet and containerd down with it.

        - alert: HostRootDiskSpaceCritical
          expr: |
            100 * (
              1 - node_filesystem_avail_bytes{mountpoint="/", fstype=~"ext4|xfs|btrfs"}
                / node_filesystem_size_bytes{mountpoint="/", fstype=~"ext4|xfs|btrfs"}
            ) >= 90
          for: 5m
          labels:
            severity: critical
            component: disk
          annotations:
            summary: "Root filesystem {{ $value | printf \"%.0f\" }}% full on {{ $labels.nodename }}{{ $labels.instance }}"
            description: >-
              OS disk above 90%. Imminent failure of kubelet/containerd on this
              node. Free space now.

    # Memory (EDAC). Only the ECC-capable hosts report these at all.
    - name: bijouxlabs.memory
      rules:
        - alert: MemoryUncorrectableErrors
          expr: increase(node_edac_uncorrectable_errors_total[1h]) > 0
          for: 0m
          labels:
            severity: critical
            component: memory
          annotations:
            summary: "Uncorrectable ECC errors on {{ $labels.nodename }}"
            description: >-
              {{ $value }} uncorrectable memory errors in 1h on
              {{ $labels.nodename }}. RAM is failing and data may already be
              corrupt. Run memtest86+ for at least 4 passes.

        - alert: MemoryCorrectableErrorsHigh
          expr: increase(node_edac_correctable_errors_total[6h]) > 100
          for: 0m
          labels:
            severity: warning
            component: memory
          annotations:
            summary: "Elevated correctable ECC errors on {{ $labels.nodename }}"
            description: >-
              {{ $value }} correctable errors in 6h on {{ $labels.nodename }}.
              Corrected for now, but a rising rate predicts a DIMM failure.

    # Thermals. Scoped to CPU package/core sensors: NVMe has its own rules
    # above, and thermal_zone0 reads ambient and would never fire.
    - name: bijouxlabs.thermal
      rules:
        # TODO: 70C is calibrated for the 35W T-series hosts. node04g4800 runs a
        # 65W i5-8500 that idles at ~69C, so this fires on its normal operating
        # temperature. Needs a per-host threshold.
        - alert: HostCPUTemperatureWarning
          expr: |
            max by (nodename, instance) (
              node_hwmon_temp_celsius{
                job="proxmox-node-exporter",
                chip=~"platform_coretemp.*|.*k10temp.*"
              }
            ) >= 70
          for: 5m
          labels:
            severity: warning
            component: thermal
          annotations:
            summary: "CPU on {{ $labels.nodename }} at {{ $value | printf \"%.0f\" }}°C"
            description: >-
              CPU temperature has been at or above 70°C for 5m. Not yet
              critical.

        # The desktop's 5900X reports Tctl (TjMax 95C) and runs 80C legitimately
        # under load, so this uses a long window to catch "stuck hot".
        - alert: DesktopCPUTemperatureWarning
          expr: |
            max by (nodename, instance) (
              node_hwmon_temp_celsius{
                job="desktop-node-exporter",
                chip=~"platform_coretemp.*|.*k10temp.*"
              }
            ) >= 80
          for: 15m
          labels:
            severity: warning
            component: thermal
          annotations:
            summary: "Desktop CPU at {{ $value | printf \"%.0f\" }}°C for 15m"
            description: >-
              Desktop CPU has held at or above 80°C for 15 minutes.

        # Compared against each sensor's own critical threshold, so it self-tunes.
        - alert: HostTemperatureCritical
          expr: node_hwmon_temp_celsius >= on(instance, chip, sensor) node_hwmon_temp_crit_celsius
          for: 5m
          labels:
            severity: critical
            component: thermal
          annotations:
            summary: "{{ $labels.nodename }} sensor {{ $labels.sensor }} at {{ $value }}°C"
            description: >-
              Temperature has been at or above the manufacturer's critical
              threshold for 5m. Expect throttling then shutdown. Check fans and
              dust.

    # Network. The I219-LM e1000e TX hang is silent on the wedged host itself,
    # so these catch it from the surviving side.
    - name: bijouxlabs.network
      rules:
        - alert: HostNetworkTransmitErrors
          expr: increase(node_network_transmit_errs_total{job="proxmox-node-exporter", device!~"lo|veth.*|tap.*|fwbr.*|fwln.*|fwpr.*"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
            component: network
          annotations:
            summary: "TX errors on {{ $labels.nodename }} {{ $labels.device }}"
            description: >-
              {{ $value }} transmit errors in 15m. On the m920/g4800 hosts this
              is the Intel I219-LM (8086:15bb) e1000e "Hardware Unit Hang"
              signature — the NIC's TX unit wedges while the OS stays up, so the
              host looks powered-on with link lights but is unreachable.
              Mitigation: ethtool -K <dev> tso off gso off.

        - alert: HostNetworkCarrierFlapping
          expr: changes(node_network_carrier_changes_total{job="proxmox-node-exporter", device!~"lo|veth.*|tap.*|fwbr.*|fwln.*|fwpr.*"}[30m]) > 4
          for: 0m
          labels:
            severity: warning
            component: network
          annotations:
            summary: "Link flapping on {{ $labels.nodename }} {{ $labels.device }}"
            description: >-
              Carrier changed {{ $value }} times in 30m. Suspect cable, switch
              port, or a NIC resetting itself out of a hang.
