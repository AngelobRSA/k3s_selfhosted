apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bijouxlabs-cluster
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # ------------------------------------------------------------------
    # Longhorn. Added 2026-08-09. Until now Longhorn exported NOTHING to
    # Prometheus — there was no ServiceMonitor in longhorn-system, so
    # `longhorn_volume_robustness` had zero series and no rule could have
    # fired. Enabled via `metrics.serviceMonitor` in
    # cluster/longhorn/helmrelease.yaml.
    #
    # robustness: 0=unknown 1=healthy 2=degraded 3=faulted
    # ------------------------------------------------------------------
    - name: bijouxlabs.longhorn
      rules:
        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 1m
          labels:
            severity: critical
            component: storage
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is FAULTED"
            description: >-
              {{ $labels.volume }} has no usable replica and cannot serve I/O.
              Any pod using it is down or will hang. If this followed a node
              loss the data is probably intact and returns with the node —
              check before assuming loss. Runbook:
              docs/runbooks/reference_longhorn_b2_restore.md

        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 15m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} degraded for 15m"
            description: >-
              Running on fewer replicas than requested. 15m of grace is
              deliberate: a node reboot degrades volumes briefly and they
              rebuild on their own. Still degraded after 15m means the rebuild
              cannot place a replica — with replicaZoneSoftAntiAffinity=false
              that usually means too few distinct zones are available.

        # The failure mode that actually bit us: a volume spec'd at N replicas
        # that has silently been running on fewer. immich-library was "2
        # replicas" but had 1 when kmaster04's disk died.
        # Running replicas per volume. `sum` over the {state="running"} series
        # rather than `count(... == 1)`: the running series exists with value 0
        # for a replica that is not running, so summing keeps a series for a
        # volume at ZERO running replicas. A count-and-filter drops it, which
        # makes the worst case indistinguishable from "no such volume".
        # The `* 0 + 1` idiom copies pvc/pvc_namespace onto the count without
        # touching its value, so the alert can say "immich/immich-library"
        # instead of "pvc-7573a49b-...". The `or ... unless` tail keeps a bare
        # series for any volume that has replicas but no robustness metric —
        # without it a failed join would silently drop that volume from the
        # alert, which is the same fail-open behaviour this rule exists to fix.
        - record: bijouxlabs:longhorn_running_replicas_per_volume
          expr: |
            sum by (volume) (longhorn_replica_state{state="running"})
              * on (volume) group_left(pvc, pvc_namespace)
                (max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness) * 0 + 1)
            or
            (
              sum by (volume) (longhorn_replica_state{state="running"})
              unless on (volume) max by (volume) (longhorn_volume_robustness)
            )

        # 🔴 This alert existed since 2026-08-09 and could NEVER fire: it was
        # written against `longhorn_replica_actual_size_bytes`, which this
        # version of longhorn-manager does not export. Only
        # longhorn_replica_info and longhorn_replica_state exist. A rule naming
        # a nonexistent metric evaluates to the empty set — it does not error —
        # so it looked identical to "no volume is under-replicated" for months.
        # Verified dead and rewritten 2026-08-22.
        #
        # This is the alert for the failure that cost immich-library and both
        # vaultwarden volumes: Longhorn calls a volume `healthy` when its
        # replicas AGREE, not when there are enough of them. A volume with
        # exactly one replica is permanently, contentedly healthy.
        # No exclusions, deliberately. The two detached vaultwarden husks that
        # would have sat here at 0 replicas forever were DELETED on 2026-08-22
        # rather than filtered out — fix the data, not the query. Prometheus is
        # NOT excluded either: its data is disposable, but it silently dropping
        # to one replica is exactly the 2026-08 failure and must still page.
        - alert: LonghornVolumeReplicaShortfall
          expr: |
            bijouxlabs:longhorn_running_replicas_per_volume < 2
          for: 30m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has {{ $value }} replica(s)"
            description: >-
              Reporting healthy but backed by a single replica, so it is one
              disk or one host away from being unrecoverable. `healthy` means
              "replicas agree", not "data is safe".

        - alert: LonghornNodeStorageLow
          expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) > 0.85
          for: 30m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "Longhorn storage {{ $value | printf \"%.0f\" }}% used on {{ $labels.node }}"
            description: >-
              Above 85%. Longhorn needs free space to rebuild replicas; running
              out means a node loss cannot be recovered from.

        # ----------------------------------------------------------------
        # Backups. Added 2026-09-03 after B2 backups had been silently dead
        # for WEEKS: a DNS search-domain hijack sent s3...backblazeb2.com to
        # Traefik, so every upload failed x509 verification. Nothing alerted.
        #
        # 🔴 The reason nothing alerted is the important part: the Longhorn
        # backup TARGET reported `available: True` the entire time, and the
        # backup-daily CronJob reported `Complete` — it dutifully attempted
        # every volume and each one failed, in 145 minutes. Both of the
        # obvious signals were green. Never alert on target availability or
        # on job success; alert on whether NEW DATA actually landed.
        #
        # There is no backup-timestamp metric — `longhorn_backup_state` is
        # all we get, and retention keeps 7 Completed backups per volume
        # forever, so neither the state nor the count changes as backups go
        # stale. Freshness is therefore derived by IDENTITY: each run creates
        # a backup CR with a new `backup` label, so
        #   (state == 3) unless (state offset 25h)
        # is "Completed backups that did not exist 25h ago" — i.e. genuinely
        # new ones. A volume with none is stale.
        #
        # `and on (volume) (longhorn_volume_robustness)` restricts this to
        # volumes that STILL EXIST, so retired husks (pvc-fb63b9dc, the old
        # faulted immich volume) don't alert forever.
        #
        # ⚠️ Known fail-open: if Prometheus has no data at offset 25h (e.g.
        # after the kind of TSDB outage in project_prometheus_ext4_journal_
        # abort), every backup looks "new" and this stays silent. It is a
        # backstop, not a substitute for the external dead-man's switch.
        #
        # Verified against a known-true positive on 2026-09-03: returned the
        # 17 live stale volumes and independently reproduced the per-volume
        # lastSyncedAt analysis. state: 0=New 1=Pending 3=Completed 4=Error
        # ----------------------------------------------------------------
        - alert: LonghornBackupStale
          expr: |
            (
              count by (volume) (longhorn_backup_state)
              unless
              count by (volume) (
                (longhorn_backup_state == 3) unless (longhorn_backup_state offset 25h)
              )
            ) and on (volume) (longhorn_volume_robustness)
          for: 1h
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "No new backup for {{ $labels.volume }} in over 25h"
            description: >-
              The daily job has produced no NEW completed backup for this
              volume in more than 25 hours, so it is drifting out of
              protection. Check the backup CRs for an Error state and confirm
              the volume can still reach B2 — from the node holding its
              REPLICA, which is what performs the upload, not the node it is
              attached to. Diagnose DNS with `getent hosts`, never nslookup.
              Runbook: docs/runbooks/reference_longhorn_b2_restore.md

        - alert: LonghornBackupsStaleClusterWide
          expr: |
            count(
              (
                count by (volume) (longhorn_backup_state)
                unless
                count by (volume) (
                  (longhorn_backup_state == 3) unless (longhorn_backup_state offset 25h)
                )
              ) and on (volume) (longhorn_volume_robustness)
            ) >= 5
          for: 2h
          labels:
            severity: critical
            component: storage
          annotations:
            summary: "{{ $value }} volumes have no fresh backup — backups are systemically broken"
            description: >-
              Several volumes went stale at once, which means a shared cause
              (backup target, credentials, DNS, network) rather than one bad
              volume. This is the shape the 2026-09-03 outage would have made.
              Treat as data-loss exposure, not a storage nuisance.

        - alert: LonghornBackupErrorsAppearing
          expr: |
            sum(longhorn_backup_state == bool 4)
            - sum(longhorn_backup_state offset 24h == bool 4) > 0
          for: 30m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "{{ $value }} new Longhorn backup errors in the last 24h"
            description: >-
              Compares against 24h ago rather than alerting on `== 4`,
              because failed backup CRs PERSIST — on 2026-09-03 there were 47
              lingering Error records, so a naive rule would fire forever on
              history and be muted as noise.

        - alert: LonghornBackupStuckPending
          expr: count by (volume) (longhorn_backup_state == 1) > 0
          for: 3h
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "Backup for {{ $labels.volume }} stuck Pending for 3h"
            description: >-
              A Pending backup is not merely a failed backup. It holds a
              `backup-controller` attachment ticket that PINS the volume to
              its node, which blocks `kubectl drain` via the instance-manager
              PDB and can stall node maintenance for hours. On 2026-09-03 one
              sat Pending for 15h at 0% and blocked a drain. Inspect with
              `kubectl get volumeattachments.longhorn.io -n longhorn-system
              <pvc> -o json`; deleting the 0%-progress backup CR releases it.

    # ------------------------------------------------------------------
    # Node health. KubeNodeNotReady ships as `warning` in kube-prometheus-
    # stack, which is why kmaster02 sat NotReady for ~6h on 2026-08-05 with
    # zero pages. These are deliberately louder.
    # ------------------------------------------------------------------
    - name: bijouxlabs.nodes
      rules:
        - alert: K8sNodeNotReadyCritical
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 10m
          labels:
            severity: critical
            component: node
          annotations:
            summary: "Node {{ $labels.node }} NotReady for 10m"
            description: >-
              Deliberately critical, overriding the upstream warning-level
              KubeNodeNotReady. If this is a master, etcd quorum is degraded:
              5 members tolerate only 2 losses.

        # Nothing detected the silent VM resets on kmaster02/node04 because
        # the node came back before anyone looked.
        - alert: K8sNodeUnexpectedReboot
          expr: changes(node_boot_time_seconds{job="node-exporter"}[1h]) > 0
          for: 0m
          labels:
            severity: warning
            component: node
          annotations:
            summary: "Node {{ $labels.instance }} rebooted in the last hour"
            description: >-
              An unplanned reboot is a hardware warning. Both kmaster02 and
              node04 have open root-cause investigations for exactly this.

        - alert: EtcdQuorumAtRisk
          expr: count(kube_node_status_condition{condition="Ready", status="true"} == 1 and on(node) kube_node_role{role="control-plane"}) < 4
          for: 5m
          labels:
            severity: critical
            component: node
          annotations:
            summary: "Only {{ $value }} of 5 control-plane nodes Ready"
            description: >-
              etcd has 5 members and needs 3 for quorum. At 3 Ready there is
              ZERO slack — one more loss takes the API down entirely. Do not
              reboot or drain anything until this clears.

    # ------------------------------------------------------------------
    # Watching the watcher. On 2026-08-09 Prometheus itself went down with
    # node02 (single-replica volume), so nothing could report the outage.
    # Fixed by moving it to 2 replicas, but the general problem stands:
    # in-cluster monitoring cannot alert on its own death.
    # ------------------------------------------------------------------
    - name: bijouxlabs.selfmonitoring
      rules:
        - alert: AlertmanagerNotificationsFailing
          expr: increase(alertmanager_notifications_failed_total[15m]) > 0
          for: 0m
          labels:
            severity: critical
            component: monitoring
          annotations:
            summary: "Alertmanager failing to deliver via {{ $labels.integration }}"
            description: >-
              Alerts are firing but not reaching ntfy. This is the silent
              failure that hid problems before the 2026-08-08 ntfy routing fix.

        - alert: PrometheusTargetsDown
          expr: count by (job) (up == 0) > 0
          for: 15m
          labels:
            severity: warning
            component: monitoring
          annotations:
            summary: "{{ $value }} target(s) down in job {{ $labels.job }}"
            description: >-
              A scrape target has been unreachable for 15m. Catches exporters
              that die quietly — node03's smartctl_exporter was down and
              unnoticed until a manual audit on 2026-08-09.

        # ------------------------------------------------------------------
        # 2026-08-24: Prometheus's PVC went read-only (ext4 journal abort) and
        # it kept running for 14.5h — alive enough to hold the dead-man's
        # switch green while emitting FALSE KubeletDown alerts and a FALSE
        # all-clear on HostManagementPlaneWedged while node04 was still wedged.
        #
        # The dead-man's switch cannot catch this by construction: it asks
        # "is Prometheus running?", and Prometheus WAS running. These two ask
        # the question it cannot — "is Prometheus still able to record?"
        #
        # Both metric names verified against the live instance before writing
        # (reference_promql_rules_fail_open: a rule naming a metric that does
        # not exist returns empty, which is indistinguishable from all-clear).
        # ------------------------------------------------------------------
        - alert: PrometheusTSDBWriteFailing
          expr: increase(prometheus_tsdb_wal_writes_failed_total[5m]) > 0
          for: 5m
          labels:
            severity: critical
            component: monitoring
          annotations:
            summary: "Prometheus cannot write its WAL — metrics are being lost"
            description: >-
              WAL writes are failing, which means the TSDB volume is unwritable
              (read-only remount, full disk, or a dead Longhorn engine). On
              2026-08-24 this exact condition ran 14.5h undetected and produced
              false alerts the whole time. Check `kubectl -n monitoring logs`
              and `dmesg -T | grep EXT4` on the node holding the volume.

        - alert: PrometheusNotIngesting
          # sum() is load-bearing. This metric splits by a `type` label into
          # {type="float"} and {type="histogram"}; native histograms are unused
          # here so the histogram series sits at 0 forever. Without the sum,
          # the bare rate() matches it and the alert fires permanently — a
          # guaranteed false positive, which is how you train yourself to
          # ignore the alerts that matter. Caught by running the expression
          # against the live instance before committing it.
          expr: sum(rate(prometheus_tsdb_head_samples_appended_total[10m])) == 0
          for: 10m
          labels:
            severity: critical
            component: monitoring
          annotations:
            summary: "Prometheus has stopped appending samples"
            description: >-
              Prometheus is up and evaluating but no longer recording any
              samples, so every range query silently returns empty and rules
              that depend on data will fail open. Backstop for the case where
              WAL writes succeed but ingestion has stalled.
