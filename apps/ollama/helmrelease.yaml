apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ollama
  namespace: flux-system
spec:
  interval: 12h
  url: https://otwld.github.io/ollama-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ollama
spec:
  releaseName: ollama
  chart:
    spec:
      chart: ollama
      sourceRef:
        kind: HelmRepository
        name: ollama
        namespace: flux-system
  interval: 30m
  timeout: 10m
  values:
    # TODO (parked): define the hardening for the ollama container to clear radar's
    # privilegeEscalation (danger) + runAsRoot/readOnlyRootFs warnings.
    # The otwld/ollama chart wires these two keys straight into the pod:
    #   podSecurityContext:   -> pod-level (fsGroup, runAsUser/Group, runAsNonRoot, seccompProfile)
    #   securityContext:      -> container-level (allowPrivilegeEscalation, readOnlyRootFilesystem, capabilities)
    # Ollama stores models under /root/.ollama by default and this chart mounts the
    # PVC there — so your UID choice and any readOnlyRootFilesystem decision have to
    # keep that path (and /tmp) writable. Fill in both blocks below.
    podSecurityContext: {}
    securityContext: {}

    ollama:
      gpu:
        enabled: false

    persistentVolume:
      enabled: true
      storageClass: longhorn-single
      size: 5Gi

    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
      hosts:
        - host: ollama.bijouxlabs.cc
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - ollama.bijouxlabs.cc

    nodeSelector:
      kubernetes.io/hostname: kworker02

    # Sized from Goldilocks/VPA, 18d (2026-08-09). Memory request was 512Mi
    # against a measured 1.1Gi (upper bound 1.2Gi). CPU dropped 700m→100m: the
    # 700m reservation was idle almost always, and with no cpu limit ollama can
    # still burst across the whole node during inference.
    resources:
      requests:
        cpu: 100m
        memory: 1280Mi
      limits:
        memory: 4Gi
