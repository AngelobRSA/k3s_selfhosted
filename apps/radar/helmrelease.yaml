apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: skyhook
  namespace: flux-system
spec:
  interval: 12h
  url: https://skyhook-io.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
  namespace: radar
spec:
  releaseName: radar
  chart:
    spec:
      chart: radar
      sourceRef:
        kind: HelmRepository
        name: skyhook
        namespace: flux-system
  interval: 30m
  values:
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
      hosts:
        - host: radar.bijouxlabs.cc
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - radar.bijouxlabs.cc

    # Sized from Goldilocks/VPA, 18d (2026-08-09). The chart's defaults
    # (100m/500m cpu, 128Mi/512Mi memory) were previously inherited implicitly;
    # pinning them here makes them visible. Memory measured 363Mi (upper bound
    # 384Mi) against a 128Mi request. cpu limit dropped — compressible, and
    # radar was showing measurable (if small) CFS throttling.
    # Verified against `helm show values skyhook/radar`: top-level `resources`.
    resources:
      requests:
        cpu: 25m
        memory: 384Mi
      limits:
        memory: 512Mi

    rbac:
      podExec: false
      portForward: true
      secrets: false
      helm: false

    persistence:
      enabled: true
      storageClass: longhorn-single
      size: 1Gi

    timeline:
      storage: sqlite
