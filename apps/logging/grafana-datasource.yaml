# Picked up by kube-prometheus-stack's grafana-sc-datasources sidecar, which
# watches for ConfigMaps labelled grafana_datasource=1 (verified against the
# live sidecar's LABEL / LABEL_VALUE env) and drops them into
# /etc/grafana/provisioning/datasources.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: logging
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        # gateway is disabled, so this addresses the Loki Service directly.
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: false
        jsonData:
          # Must match the Loki chart's limits_config.retention_period.
          maxLines: 1000
