# Separate from the chart because its values.schema.json requires
# ingress.tls[].secretName, which Traefik never reads here.
#
# No `certresolver` annotation on purpose: Traefik already serves a wildcard
# `*.bijouxlabs.cc` Let's Encrypt cert as its default, which covers this host.
# Verified 2026-08-09 — todo.bijouxlabs.cc has no certresolver annotation and
# serves the same wildcard cert as photos.bijouxlabs.cc, which does. Matches
# the vikunja pattern.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actualbudget
  namespace: actualbudget
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: budget.bijouxlabs.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actualbudget
                port:
                  number: 5006
  tls:
    - hosts:
        - budget.bijouxlabs.cc
