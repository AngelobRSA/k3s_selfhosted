apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: karakeep
  namespace: flux-system
spec:
  interval: 12h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.3.0
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
  namespace: karakeep
spec:
  releaseName: karakeep
  chartRef:
    kind: OCIRepository
    name: karakeep
    namespace: flux-system
  interval: 30m
  timeout: 10m
  values:
    controllers:
      karakeep:
        forceRename: karakeep
        pod:
          labels:
            app.kubernetes.io/component: application
        containers:
          app:
            securityContext:
              allowPrivilegeEscalation: false
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
            env:
              BROWSER_WEB_URL: http://karakeep-chrome.karakeep.svc.cluster.local:9222
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
              OLLAMA_BASE_URL: http://ollama.ollama.svc.cluster.local:11434
              INFERENCE_TEXT_MODEL: llama3.2:3b
              INFERENCE_IMAGE_MODEL: moondream
              DATA_DIR: /data
              DISABLE_SIGNUPS: false
              MEILI_ADDR: http://karakeep-meilisearch.karakeep.svc.cluster.local:7700
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: meilisearch_master_key
              NEXTAUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: encryption_key
              NEXTAUTH_URL: https://karakeep.bijouxlabs.cc
              DISABLE_NEW_RELEASE_CHECK: true
              COREPACK_INTEGRITY_KEYS: 0
              REDIS_HOST: karakeep-redis
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            # Sized from Goldilocks/VPA, 18d (2026-08-09).
            # 🔴 Had a memory limit but NO memory request, so the scheduler
            # counted this container as needing 0Mi while it actually used
            # ~641Mi. cpu request raised to 50m: target is 23m but the upper
            # bound is 760m — crawling is genuinely bursty, so this is the one
            # place the VPA *target* would badly under-serve it.
            resources:
              requests:
                cpu: 50m
                memory: 640Mi
              limits:
                memory: 1Gi

      chrome:
        pod:
          labels:
            app.kubernetes.io/component: chrome
        containers:
          app:
            image:
              repository: docker.io/zenika/alpine-chrome
              tag: 124@sha256:eb3378c1ed0079f94db054a5fe1aaa790a254ec0d6bbc67eda052420d86a179d
            command:
              - chromium-browser
            args:
              - --headless
              - --no-sandbox
              - --disable-gpu
              - --disable-dev-shm-usage
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --hide-scrollbars
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            # No memory request despite a 1Gi limit; measured 309Mi.
            resources:
              requests:
                cpu: 25m
                memory: 320Mi
              limits:
                memory: 1Gi

      meilisearch:
        pod:
          labels:
            app.kubernetes.io/component: meilisearch
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - karakeep
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - karakeep
                  topologyKey: kubernetes.io/hostname
        containers:
          app:
            securityContext:
              allowPrivilegeEscalation: false
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
            args:
              - /bin/meilisearch
              - --upgrade-db  # renamed from --experimental-dumpless-upgrade in meilisearch v1.51
            env:
              MEILI_NO_ANALYTICS: true
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: meilisearch_master_key
            # No memory request despite a 2Gi limit; measured below the
            # recommender's 100Mi floor.
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 2Gi

      redis:
        containers:
          redis:
            securityContext:
              allowPrivilegeEscalation: false
            image:
              repository: docker.io/valkey/valkey
              tag: "8.1.11"
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi

    persistence:
      data:
        existingClaim: karakeep-data
        advancedMounts:
          karakeep:
            app:
              - path: /data
                subPath: karakeep
          meilisearch:
            app:
              - path: /meili_data
                subPath: meilisearch

    service:
      app:
        controller: karakeep
        forceRename: karakeep
        ports:
          http:
            port: 3000
        primary: true
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
      redis:
        controller: redis
        ports:
          http:
            port: 6379

    ingress:
      app:
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
        hosts:
          - host: karakeep.bijouxlabs.cc
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
