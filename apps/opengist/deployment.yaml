apiVersion: apps/v1
kind: Deployment
metadata:
  name: opengist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opengist
  template:
    metadata:
      labels:
        app: opengist
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: opengist
          image: ghcr.io/thomiceli/opengist:1.13.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6157
              name: http
          env:
            - name: OG_HTTP_PORT
              value: "6157"
            - name: OG_BASE_URL
              value: https://opengist.bijouxlabs.cc
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /opengist
          # Sized from Goldilocks/VPA, 18d of samples (2026-08-09).
          # cpu limit dropped (compressible; never throttled, but the ceiling
          # bought nothing). Memory request raised to the measured 105Mi.
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opengist-data
