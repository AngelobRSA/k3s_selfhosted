apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: qdrant
  namespace: flux-system
spec:
  interval: 12h
  url: https://qdrant.github.io/qdrant-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
  namespace: qdrant
spec:
  releaseName: qdrant
  chart:
    spec:
      chart: qdrant
      sourceRef:
        kind: HelmRepository
        name: qdrant
        namespace: flux-system
  interval: 30m
  values:
    replicaCount: 1

    # Sized from Goldilocks/VPA, 18d (2026-08-09). Measured 422Mi (upper bound
    # 450Mi) against a 256Mi request — a vector DB's mmap'd index grows with
    # the collection, so under-requesting it understates real node pressure.
    resources:
      requests:
        cpu: 25m
        memory: 512Mi
      limits:
        memory: 1Gi

    persistence:
      accessModes: ["ReadWriteOnce"]
      storageClassName: longhorn-single
      size: 10Gi

    extraEnv:
      - name: QDRANT__SERVICE__API_KEY
        valueFrom:
          secretKeyRef:
            name: qdrant-secret
            key: api-key

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
      hosts:
        - host: qdrant.bijouxlabs.cc
          paths:
            - path: /
              pathType: Prefix
              servicePort: 6333
      tls:
        - hosts:
            - qdrant.bijouxlabs.cc
