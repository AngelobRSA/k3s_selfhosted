apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: immich
  namespace: immich
spec:
  interval: 12h
  url: oci://ghcr.io/immich-app/immich-charts/immich
  ref:
    tag: "0.10.3"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: immich
  values:
    # Shared across all Immich components
    controllers:
      main:
        containers:
          main:
            image:
              tag: v2.5.6
            env:
              REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-app
                    key: port
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-app
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-app
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-app
                    key: dbname

    immich:
      persistence:
        library:
          existingClaim: immich-library

    # Valkey (Redis-compatible) for job queues
    valkey:
      enabled: true
      persistence:
        data:
          type: emptyDir
      controllers:
        main:
          containers:
            main:
              # Sized from Goldilocks/VPA, 18d (2026-08-09). Measured 9Mi live
              # against a 256Mi request; an unbounded queue worker also had no
              # memory limit at all.
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 256Mi

    # Immich server with Traefik ingress
    server:
      ingress:
        main:
          enabled: true
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
          ingressClassName: traefik
          hosts:
            - host: photos.bijouxlabs.cc
              paths:
                - path: /
                  service:
                    identifier: main
          tls:
            - hosts:
                - photos.bijouxlabs.cc
      controllers:
        main:
          containers:
            main:
              # Sized from Goldilocks/VPA, 18d (2026-08-09).
              # 🔴 Had NO memory limit — unbounded, so a leak here could take a
              # whole node with it. Request was 256Mi against a measured 878Mi
              # (upper bound 940Mi), so the scheduler was under-counting it by
              # ~600Mi on a memory-tight cluster.
              resources:
                requests:
                  cpu: 25m
                  memory: 1Gi
                limits:
                  memory: 1536Mi

    # Machine learning (facial recognition + smart search)
    # Pinned off kworker01 (CPU-constrained, 2 vCPU cap, was contending with
    # ollama for cycles) onto kworker07 (least-loaded worker in the cluster).
    machine-learning:
      enabled: true
      persistence:
        cache:
          enabled: true
          type: emptyDir
          size: 10Gi
      controllers:
        main:
          pod:
            nodeSelector:
              kubernetes.io/hostname: kworker07
          containers:
            main:
              # Sized from Goldilocks/VPA, 18d (2026-08-09). Biggest single
              # reclaim in the cluster: 1Gi requested vs 454Mi measured.
              # CPU kept at 100m rather than VPA's 15m floor — inference is
              # bursty and the floor means "below my minimum", not "needs 15m".
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 3Gi
